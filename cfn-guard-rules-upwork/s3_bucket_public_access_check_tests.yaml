---
- name: Valid S3 Bucket - Should PASS
  input:
    Resources:
      SecureS3Bucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
  expectations:
    rules:
      s3_block_public_acls_access_check: PASS
      s3_block_public_policy_access_check: PASS
      s3_ignore_public_acls_access_check: PASS
      s3_restrict_public_buckets_access_check: PASS

- name: S3 Bucket Missing Public Access Block - Should FAIL
  input:
    Resources:
      InsecureS3Bucket:
        Type: AWS::S3::Bucket
        Properties:
          PublicAccessBlockConfiguration:
            BlockPublicAcls: false
            BlockPublicPolicy: false
            IgnorePublicAcls: false
            RestrictPublicBuckets: false
  expectations:
    rules:
      s3_block_public_acls_access_check: FAIL
      s3_block_public_policy_access_check: FAIL
      s3_ignore_public_acls_access_check: FAIL
      s3_restrict_public_buckets_access_check: FAIL

- name: Empty Template - Should SKIP
  input: 
    Resources: {}
  expectations:
    rules:
      s3_block_public_acls_access_check: SKIP
      s3_block_public_policy_access_check: SKIP
      s3_ignore_public_acls_access_check: SKIP
      s3_restrict_public_buckets_access_check: SKIP